name: Update profile art

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/profile/**'
      - 'data/profile/profile.json'
      - 'data/profile/portrait.json'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch calendar and generate SVGs
        run: python3 scripts/profile/generate.py --fetch
      - name: Commit updated art
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile/identity.svg assets/profile/contributions.svg data/profile/contributions.json
          if git diff --cached --quiet; then
            echo 'Profile art is already current.'
          else
            git commit -m 'chore: refresh profile art [skip ci]'
            git push
          fi
